openapi: 3.0.0

info:
  title: API сервис задач (Органайзер домашних дел)
  version: 1.0.0
  description: |
    API сервиса задач мобильного приложения Wildberries, раздел «Органайзер домашних дел».

    Сервис хранит задачи пользователя и управляет ими: создание, просмотр, редактирование,
    смена статуса и удаление.

servers:
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/personalprojects-bed/organizer-api/1.0.0

  - url: http://localhost:8080/api/v1/
    description: Development server

tags:
  - name: Tasks
    description: Работа с задачами

  - name: Categories
    description: Справочник категорий задач

security:
  - bearerAuth: []

paths:

  /tasks:
    get:
      tags:
        - Tasks
      summary: Получить список задач
      description: Возвращает задачи пользователя страницами, отсортированными по сроку выполнения (dueAt), затем по id.
      operationId: getAllTasks
      parameters: 
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/DueFrom'
        - $ref: '#/components/parameters/DueTo'
        - $ref: '#/components/parameters/CategoryIdFilter'
        - $ref: '#/components/parameters/StatusFilter'

      responses:
        '200':
          description: Список задач успешно получен.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskPage'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '401':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags:
        - Tasks
      summary: Создать новую задачу
      description: Создает задачу со статусом NEW. Повторный запрос с тем же Idempotency-Key не создаёт вторую задачу.
      operationId: createTask
      parameters: 
        - $ref: '#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        description: Данные новой задачи.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInPut'

      responses:
        '201':
          description: Задача успешно создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '401':
          $ref: '#/components/responses/ErrorResponse'

        '409':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    get:
      tags:
        - Tasks
      summary: Получить задачу по идентификатору
      description: Возвращает полную информацию о задаче по её идентификатору.
      operationId: getTaskById

      responses:
        '200':
          description: Задача успешно получена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        
        '401':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

    put:
      tags:
        - Tasks
      summary: Изменить параметры задачи
      description: Обновляет параметры существующей задачи.
      operationId: updateTask

      requestBody:
        required: true
        description: Новые данные задачи.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInPut'

      responses:
        '200':
          description: Задача успешно обновлена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        
        '400':
          $ref: '#/components/responses/ErrorResponse'
 
        '401':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - Tasks
      summary: Удалить задачу
      description: Удаляет задачу по её идентификатору.
      operationId: deleteTask

      responses:
        '204':
          description: Задача успешно удалена.

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '401':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /tasks/{taskId}/status:
    parameters:
      - $ref: '#/components/parameters/TaskId'

    patch:
      tags:
        - Tasks
      summary: Изменить статус задачи
      description: Изменяет статус существующей задачи.
      operationId: updateTaskStatus

      requestBody:
        required: true
        description: Новый статус задачи.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskStatusChange'

      responses:
        '200':
          description: Статус задачи успешно изменен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusChange'

        '400':
          $ref: '#/components/responses/ErrorResponse'

        '401':
          $ref: '#/components/responses/ErrorResponse'

        '404':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

  /categories:
    get:
      tags:
        - Categories
      summary: Получить список категорий
      description: |
        Возвращает справочник категорий задач. Идентификаторы категорий нужны,
        чтобы создавать и редактировать задачи, а названия показываются пользователю.
      operationId: getCategories

      responses:
        '200':
          description: Список категорий.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1
                  name: Дом и уборка
                - id: 2
                  name: Ремонт и обслуживание
                - id: 3
                  name: Покупка для дома
                - id: 4
                  name: Семья и дети
                - id: 5
                  name: Путешествия
                - id: 6
                  name: Праздники
                - id: 7
                  name: Личные задачи

        '401':
          $ref: '#/components/responses/ErrorResponse'

        '500':
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT-токен, используемый для авторизации пользователя.

  parameters:
    TaskId:
      name: taskId
      in: path
      description: Идентификатор задачи.
      required: true
      schema:
        type: integer
        minimum: 1
      example: 1842

    CategoryIdFilter:
      name: categoryId
      in: query
      required: false
      description: Только задачи этой категории.
      schema:
        $ref: '#/components/schemas/CategoryId'

    StatusFilter:
      name: status
      in: query
      required: false
      description: Только задачи этого статуса
      schema:
        $ref: '#/components/schemas/TaskStatus'

    DueFrom:
      name: dueFrom
      in: query
      required: false
      description: Срок выполнения не раньше этой даты.
      schema:
        type: string
        format: date-time

    DueTo:
      name: dueTo
      in: query
      required: false
      description: Срок выполнения раньше этой даты.
      schema:
        type: string
        format: date-time

    Limit:
      name: limit
      in: query
      required: false
      description: Максимум задач на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Cursor:
      name: cursor 
      in: query
      required: false
      description: Значение nextCursor из предыдущего ответа. Для первой страницы не передаётся.
      schema:
        type: string

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true 
      description: Уникальный ключ операции. Приложение создаёт его один раз на действие пользователя и повторяет при повторной отправке.
      schema:
        type: string
        format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
  
  headers: 
    IdempotencyReplayed:
      description: Равен true, если ответ повторен по ранее сохраненному ключу.
      schema:
        type: boolean
 
    RetryAfter:
      description: Через сколько секунд можно повторить запрос.
      schema:
        type: integer
        minimum: 0

  schemas:

    TaskStatus:
      type: string
      enum:
        - NEW
        - IN_PROGRESS
        - POSTPONED
        - DONE
        - CANCELLED
    
    CategoryId:
      type: integer
      format: int64
      minimum: 1
      example: 1

    TaskPriority:
      type: string
      enum:
        - HIGH
        - MEDIUM
        - LOW
      default: MEDIUM

    Recurrence:
      type: string
      enum:
        - NEVER
        - DAILY
        - WEEKLY
        - MONTHLY
        - YEARLY
      default: NEVER

    Category:
      type: object
      description: Категория задачи.
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          description: Название категории.
          example: Дом и уборка

    Reminder:
      type: object
      description: Настройки напоминания о задаче.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Включено ли напоминание.
          default: false

        remindAt:
          type: string
          format: date-time
          description: Обязательно, если enabled=true. Должно быть в будущем.
          example: "2026-11-03T09:00:00+03:00"

    TaskInPut:
      type: object
      description: Параметры задачи, которые задает пользователь (создание и изменение).
      required:
        - title
        - categoryId
        - dueAt
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Название задачи.
          example: Заменить фильтр для воды

        categoryId:
          $ref: '#/components/schemas/CategoryId'

        dueAt:
          type: string
          format: date-time
          description: Срок выполнения. Не может быть в прошлом.
          example: "2026-11-03T10:00:00+03:00"

        priority:
          $ref: '#/components/schemas/TaskPriority'

        recurrence:
          $ref: '#/components/schemas/Recurrence'

        reminder:
          $ref: '#/components/schemas/Reminder'
      
    TaskStatusChange:
      type: object
      description: Новый статус задачи.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'

    Task:
      type: object
      description: Полная информация о задаче.
      required:
        - id
        - title
        - category
        - status
        - priority
        - dueAt
        - recurrence
        - reminder
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          description: Идентификатор задачи, присваивается сервером.
          example: 1842

        title:
          type: string
          example: Заменить фильтр для воды

        category:
          $ref: '#/components/schemas/Category'

        status:
          $ref: '#/components/schemas/TaskStatus'

        priority:
          $ref: '#/components/schemas/TaskPriority'

        dueAt:
          type: string
          format: date-time
          example: "2026-11-03T10:00:00+03:00"

        recurrence:
          $ref: '#/components/schemas/Recurrence'

        reminder:
          $ref: '#/components/schemas/Reminder'

        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Когда задача создана.
          example: "2026-10-27T18:30:00+03:00"

        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Когда задача изменялась в последний раз.
          example: "2026-10-27T18:30:00+03:00"

    TaskPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: string
          nullable: true
          description: Курсор следующей страницы. null, если страница последняя.
          example: eyJkdWVBdCI6IjIwMjYtMTEtMDNUMTA6MDA6MDArMDM6MDAiLCJpZCI6MTg0Mn0

    Error:
      type: object
      description: Модель ответа, возвращаемая API при возникновении ошибки. Используется для всех ответов с кодами 4xx и 5xx.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машинный код ошибки.

        message:
          type: string
          description: Понятное описание ошибки, которое можно показать пользователю.

        details:
          type: array
          description: Дополнительная информация об ошибке (например, ошибки валидации полей).
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                description: Поле, в котором обнаружена ошибка.
              message:
                type: string
                description: Описание ошибки для указанного поля.

  responses:
    ErrorResponse:
      description: Стандартный ответ API при возникновении ошибки.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'