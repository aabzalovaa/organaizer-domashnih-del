syntax = "proto3";

package organizer.tasks;

import "google/protobuf/timestamp.proto";

message Event {
    string event_id = 1;
    EventType event_type = 2;
    google.protobuf.Timestamp occurred_at = 3;
    oneof task {
        TaskCreated created = 4;
        TaskUpdated updated = 5;
        TaskDeleted deleted = 6;
    }
}

enum EventType {
    UNSPECIFIED = 0;
    CREATED = 1;
    UPDATED = 2;
    DELETED = 3;
} 

message TaskCreated {
    Task task = 1; 
}

message TaskUpdated {
    string task_id = 1;
    string old_status = 2;
    string new_status = 3;
}

message TaskDeleted {
    string task_id = 1;
    string user_id = 2;
}

message Task {
    string task_id = 1;
    string user_id = 2;
    string title = 3;
    google.protobuf.Timestamp due_at = 4; 
    int32 category_id = 5;
    Recurrence recurrence = 6;
}

enum Recurrence {
    NEVER = 0;
    DAILY = 1;
    WEEKLY = 2;
    MONTHLY = 3;
    YEARLY = 4;
}